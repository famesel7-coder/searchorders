[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "search-orders"
version = "0.2.0"
description = "Social and community demand intelligence for I’MON Digital Agency"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Telethon>=1.44,<2.0",
  "PyYAML>=6.0,<7.0",
]

[project.scripts]
search-orders = "searchorders.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
