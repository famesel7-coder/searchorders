[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "search-orders"
version = "0.1.0"
description = "Lead discovery and qualification pipeline for I’MON Digital Agency"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7.0",
]

[project.scripts]
search-orders = "searchorders.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

