x-search-orders-base: &search-orders-base
  build:
    context: .
  image: imon-search-orders:local
  init: true
  environment:
    TZ: Europe/Moscow
    OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
    TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
    TELEGRAM_API_ID: "${TELEGRAM_API_ID:-}"
    TELEGRAM_API_HASH: "${TELEGRAM_API_HASH:-}"
    TELEGRAM_SESSION: "${TELEGRAM_SESSION:-}"
  volumes:
    - ./data:/app/data:ro
    - ./output:/app/output
    - ./state:/app/state
  restart: unless-stopped

services:
  search-orders:
    <<: *search-orders-base
    command: ["web", "--host", "0.0.0.0", "--port", "8080", "--title", "I’MON Search Orders"]
    ports:
      - "${WEB_PORT:-80}:8080"

  search-orders-bot:
    <<: *search-orders-base
    command: ["bot"]
